name: Publicar en GitHub Pages

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

# Permisos mínimos que necesita el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se pushea dos veces seguidas, que termine el último y se cancele el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Antes de publicar, que los datos del recetario sean consistentes.
      - run: npm run validar
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
